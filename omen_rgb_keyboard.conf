# OMEN RGB Keyboard Driver Configuration
# This file contains module options for the omen_rgb_keyboard driver

# Optional: Set any module parameters here if needed
# options omen_rgb_keyboard debug=1

# Stop the desktop dimming the keyboard backlight when the session goes idle.
# The level is then only changed by writing rgb_zones/brightness.
# options omen_rgb_keyboard brightness_lock=1

# Switch the keyboard backlight on when the driver loads, unless the saved
# brightness is zero. Set to 0 to keep the keyboard dark at boot.
# options omen_rgb_keyboard lighting_on_boot=0
